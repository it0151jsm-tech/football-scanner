name: Regression tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt -r requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-thai-tlwg
      - run: python scripts/run_offline_tests.py
        env:
          DASHBOARD_SCREENSHOTS: test-artifacts
      - run: python -m py_compile app.py mobile_dashboard.py market_recommendations.py history_data.py ou_market.py manual_quotes.py data_health.py scripts/check_e2_history.py scripts/audit_leagues.py foundation/*.py scripts/foundation_smoke.py scripts/run_offline_tests.py
      - name: Offline foundation import, validation and restore
        run: python scripts/foundation_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-and-regression-reports
          path: test-artifacts/
          if-no-files-found: ignore
